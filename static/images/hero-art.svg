<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#061510" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04120d" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0d2b1f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#04120d" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#05d686"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ffec0"/>
      <stop offset="100%" stop-color="#e0f2ec"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00f5a0" flood-opacity="0.16"/>
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#00f5a0" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="620" cy="280" r="180" fill="#059669" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="420" cy="380" r="140" fill="#10b981" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Dynamic Curved Soundwaves (Audio Speech Recognition) -->
  <g opacity="0.5">
    <path d="M 40,240 Q 120,180 200,240 T 360,240 T 520,240 T 680,240 T 780,240" fill="none" stroke="#00f5a0" stroke-width="2.5" stroke-dasharray="6,6"/>
    <path d="M 40,270 Q 140,330 240,270 T 440,270 T 640,270 T 780,270" fill="none" stroke="#34d399" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Equalizer Bars Overlay -->
  <g transform="translate(110, 310)" opacity="0.4">
    <rect x="0" y="20" width="5" height="35" rx="2.5" fill="#00f5a0"/>
    <rect x="9" y="10" width="5" height="55" rx="2.5" fill="#00f5a0"/>
    <rect x="18" y="0" width="5" height="75" rx="2.5" fill="#00f5a0"/>
    <rect x="27" y="15" width="5" height="45" rx="2.5" fill="#00f5a0"/>
    <rect x="36" y="25" width="5" height="25" rx="2.5" fill="#00f5a0"/>
    <rect x="45" y="8" width="5" height="60" rx="2.5" fill="#00f5a0"/>
    <rect x="54" y="22" width="5" height="32" rx="2.5" fill="#00f5a0"/>
  </g>

  <!-- Curved Film Strip across the background -->
  <g transform="rotate(-7 400 250)" opacity="0.95">
    <path d="M -60,160 C 180,100 520,200 860,110 L 860,215 C 520,305 180,205 -60,265 Z" fill="url(#filmGrad)" stroke="rgba(0, 245, 160, 0.25)" stroke-width="1.5"/>
    
    <!-- Film sprocket holes top -->
    <g fill="#00f5a0" opacity="0.35">
      <rect x="0" y="172" width="10" height="7" rx="1.5"/>
      <rect x="35" y="169" width="10" height="7" rx="1.5"/>
      <rect x="70" y="167" width="10" height="7" rx="1.5"/>
      <rect x="105" y="166" width="10" height="7" rx="1.5"/>
      <rect x="140" y="166" width="10" height="7" rx="1.5"/>
      <rect x="175" y="168" width="10" height="7" rx="1.5"/>
      <rect x="210" y="171" width="10" height="7" rx="1.5"/>
      <rect x="245" y="175" width="10" height="7" rx="1.5"/>
      <rect x="280" y="180" width="10" height="7" rx="1.5"/>
      <rect x="315" y="184" width="10" height="7" rx="1.5"/>
      <rect x="350" y="187" width="10" height="7" rx="1.5"/>
      <rect x="385" y="189" width="10" height="7" rx="1.5"/>
      <rect x="420" y="189" width="10" height="7" rx="1.5"/>
      <rect x="455" y="187" width="10" height="7" rx="1.5"/>
      <rect x="490" y="183" width="10" height="7" rx="1.5"/>
      <rect x="525" y="178" width="10" height="7" rx="1.5"/>
      <rect x="560" y="172" width="10" height="7" rx="1.5"/>
      <rect x="595" y="166" width="10" height="7" rx="1.5"/>
      <rect x="630" y="159" width="10" height="7" rx="1.5"/>
      <rect x="665" y="152" width="10" height="7" rx="1.5"/>
      <rect x="700" y="145" width="10" height="7" rx="1.5"/>
      <rect x="735" y="138" width="10" height="7" rx="1.5"/>
      <rect x="770" y="131" width="10" height="7" rx="1.5"/>
    </g>

    <!-- Film sprocket holes bottom -->
    <g fill="#00f5a0" opacity="0.35">
      <rect x="0" y="246" width="10" height="7" rx="1.5"/>
      <rect x="35" y="243" width="10" height="7" rx="1.5"/>
      <rect x="70" y="241" width="10" height="7" rx="1.5"/>
      <rect x="105" y="240" width="10" height="7" rx="1.5"/>
      <rect x="140" y="240" width="10" height="7" rx="1.5"/>
      <rect x="175" y="242" width="10" height="7" rx="1.5"/>
      <rect x="210" y="245" width="10" height="7" rx="1.5"/>
      <rect x="245" y="249" width="10" height="7" rx="1.5"/>
      <rect x="280" y="254" width="10" height="7" rx="1.5"/>
      <rect x="315" y="258" width="10" height="7" rx="1.5"/>
      <rect x="350" y="261" width="10" height="7" rx="1.5"/>
      <rect x="385" y="263" width="10" height="7" rx="1.5"/>
      <rect x="420" y="263" width="10" height="7" rx="1.5"/>
      <rect x="455" y="261" width="10" height="7" rx="1.5"/>
      <rect x="490" y="257" width="10" height="7" rx="1.5"/>
      <rect x="525" y="252" width="10" height="7" rx="1.5"/>
      <rect x="560" y="246" width="10" height="7" rx="1.5"/>
      <rect x="595" y="240" width="10" height="7" rx="1.5"/>
      <rect x="630" y="233" width="10" height="7" rx="1.5"/>
      <rect x="665" y="226" width="10" height="7" rx="1.5"/>
      <rect x="700" y="219" width="10" height="7" rx="1.5"/>
      <rect x="735" y="212" width="10" height="7" rx="1.5"/>
      <rect x="770" y="205" width="10" height="7" rx="1.5"/>
    </g>

    <!-- Subtitle Line across film strip -->
    <text x="380" y="232" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">
      ▶ 00:01:24 — "Break the ice with clear English subtitles."
    </text>
  </g>

  <!-- Floating Video Monitor Card (Left-Center) -->
  <g transform="translate(60, 90)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="260" height="170" rx="16" fill="#081e16" stroke="#00f5a0" stroke-width="1.8"/>
    <!-- Screen Header -->
    <circle cx="18" cy="18" r="4" fill="#ff5252"/>
    <circle cx="32" cy="18" r="4" fill="#ffd740"/>
    <circle cx="46" cy="18" r="4" fill="#00f5a0"/>
    <rect x="190" y="12" width="55" height="14" rx="4" fill="rgba(0,245,160,0.15)"/>
    <text x="217" y="23" fill="#00f5a0" font-size="8" font-weight="800" text-anchor="middle">CC ENGLISH</text>
    
    <!-- Screen Content: Play Icon in Circle -->
    <circle cx="130" cy="80" r="26" fill="url(#mintAccent)"/>
    <polygon points="124,70 142,80 124,90" fill="#04120d"/>

    <!-- Synced Subtitle Overlay Banner on Video -->
    <rect x="18" y="124" width="224" height="30" rx="6" fill="rgba(4,18,13,0.92)" stroke="rgba(0,245,160,0.3)" stroke-width="1"/>
    <text x="130" y="143" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">
      "She picked up the <tspan fill="#00f5a0" font-weight="900">bat</tspan> and stepped up."
    </text>
  </g>

  <!-- Floating Vocabulary Meaning Card (Right) -->
  <g transform="translate(480, 50)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="185" rx="18" fill="#082017" stroke="#00f5a0" stroke-width="1.8"/>
    <!-- Top badge -->
    <rect x="18" y="18" width="65" height="18" rx="4" fill="rgba(0,245,160,0.18)"/>
    <text x="50" y="31" fill="#00f5a0" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">MEANING</text>
    <text x="225" y="32" fill="#a7f3d0" font-size="14" text-anchor="end">🏏 📖</text>

    <!-- Word Title -->
    <text x="18" y="65" fill="#ffffff" font-family="Georgia, serif" font-weight="700" font-size="22" font-style="italic">Bat</text>
    <text x="60" y="65" fill="#5ffec0" font-size="11" font-weight="600">/ noun /</text>

    <line x1="18" y1="76" x2="232" y2="76" stroke="rgba(255,255,255,0.12)"/>

    <!-- Definitions -->
    <text x="18" y="96" fill="#e0f2ec" font-size="10.5" font-weight="500">1. A wooden club used to hit a ball in</text>
    <text x="18" y="112" fill="#e0f2ec" font-size="10.5" font-weight="500">    sports such as cricket or baseball.</text>
    
    <!-- Context Tag -->
    <rect x="18" y="130" width="214" height="38" rx="6" fill="rgba(0,245,160,0.06)" stroke="rgba(0,245,160,0.2)"/>
    <text x="26" y="145" fill="#00f5a0" font-size="8.5" font-weight="800">SPORTS CONTEXT DETECTED</text>
    <text x="26" y="159" fill="#a7f3d0" font-size="9.5">"He held the cricket bat ready to swing."</text>
  </g>

  <!-- Floating Badge: Instant Whisper Speech AI -->
  <g transform="translate(320, 360)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="190" height="48" rx="24" fill="#082017" stroke="#00f5a0" stroke-width="1.8"/>
    <circle cx="24" cy="24" r="14" fill="url(#mintAccent)"/>
    <text x="24" y="29" fill="#04120d" font-size="12" text-anchor="middle">⚡</text>
    <text x="46" y="22" fill="#ffffff" font-size="11" font-weight="800">Instant Whisper AI</text>
    <text x="46" y="36" fill="#00f5a0" font-size="9" font-weight="700">Timed English Subtitles</text>
  </g>

  <!-- Decorative Sparkles & Stars -->
  <g fill="#00f5a0">
    <path d="M 120,410 Q 120,418 128,418 Q 120,418 120,426 Q 120,418 112,418 Q 120,418 120,410 Z"/>
    <path d="M 720,380 Q 720,387 727,387 Q 720,387 720,394 Q 720,387 713,387 Q 720,387 720,380 Z"/>
    <path d="M 450,18 Q 450,26 458,26 Q 450,26 450,34 Q 450,26 442,26 Q 450,26 450,18 Z"/>
  </g>
</svg>

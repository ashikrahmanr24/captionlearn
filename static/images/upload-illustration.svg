<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <linearGradient id="upGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="upShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f5a0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer circle with neon mint glow -->
  <circle cx="45" cy="45" r="38" fill="#091f17" stroke="rgba(0, 245, 160, 0.25)" stroke-width="2"/>

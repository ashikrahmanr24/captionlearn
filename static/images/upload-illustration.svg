  <!-- Perforations around rim -->
  <rect x="42" y="10" width="6" height="4" rx="1.5" fill="#00f5a0" opacity="0.6"/>
  <rect x="42" y="76" width="6" height="4" rx="1.5" fill="#00f5a0" opacity="0.6"/>
  <rect x="10" y="42" width="4" height="6" rx="1.5" fill="#00f5a0" opacity="0.6"/>
  <rect x="76" y="42" width="4" height="6" rx="1.5" fill="#00f5a0" opacity="0.6"/>

  <!-- Arrow -->
  <path d="M 45,30 L 55,41 L 49,41 L 49,54 L 41,54 L 41,41 L 35,41 Z" fill="#041810"/>
  <circle cx="45" cy="60" r="2.5" fill="#041810" opacity="0.9"/>
</svg>

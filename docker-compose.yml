version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=cloud-lost-found-secret-token-key-2026
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_BUCKET=item-photos
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
